name: Release packages
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to rebuild from the selected branch or tag
        required: true
        type: string
        default: v2.0.1
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false
env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macos-arm64
          - os: windows-latest
            platform: windows-amd64
          - os: ubuntu-24.04
            platform: linux-amd64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Validate release version
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Use a vMAJOR.MINOR.PATCH release tag.'; exit 1; }
          git ls-remote --exit-code origin "refs/tags/$RELEASE_TAG" > /dev/null
          VERSION=${RELEASE_TAG#v}
          node -e 'if (require("./desktop/frontend/package.json").version !== process.argv[1]) process.exit(1)' "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - uses: actions/setup-python@v5
        if: runner.os == 'macOS'
        with:
          python-version: '3.13'
      - name: Install packaging dependencies
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            python -m pip install 'dmgbuild==1.6.7' > "$RUNNER_TEMP/deps.log" 2>&1 || { tail -c 4000 "$RUNNER_TEMP/deps.log"; exit 1; }
          elif [ "$RUNNER_OS" = Windows ]; then
            choco install nsis -y --no-progress > "$RUNNER_TEMP/deps.log" 2>&1 || { tail -c 4000 "$RUNNER_TEMP/deps.log"; exit 1; }
            echo 'C:\Program Files (x86)\NSIS' >> "$GITHUB_PATH"
          else
            sudo apt-get update > "$RUNNER_TEMP/deps.log" 2>&1 && sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev desktop-file-utils >> "$RUNNER_TEMP/deps.log" 2>&1 || { tail -c 4000 "$RUNNER_TEMP/deps.log"; exit 1; }
            go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0 > "$RUNNER_TEMP/nfpm.log" 2>&1 || { tail -c 4000 "$RUNNER_TEMP/nfpm.log"; exit 1; }
          fi
      - name: Build and verify native packages
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            bash scripts/package-macos.sh "$VERSION" > "$RUNNER_TEMP/package.log" 2>&1 || { tail -c 4000 "$RUNNER_TEMP/package.log"; exit 1; }
          elif [ "$RUNNER_OS" = Windows ]; then
            pwsh -NoProfile -File scripts/package-windows.ps1 -Version "$VERSION" > "$RUNNER_TEMP/package.log" 2>&1 || { tail -c 4000 "$RUNNER_TEMP/package.log"; exit 1; }
          else
            bash scripts/package-linux.sh deb "$VERSION" > "$RUNNER_TEMP/package.log" 2>&1 || { tail -c 4000 "$RUNNER_TEMP/package.log"; exit 1; }
            desktop-file-validate desktop/build/linux/net-test.desktop
            sudo apt-get install -y ./installation_package/*.deb > "$RUNNER_TEMP/verify.log" 2>&1 || { tail -c 4000 "$RUNNER_TEMP/verify.log"; exit 1; }
          fi
      - name: Test application
        working-directory: desktop
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            export CGO_CFLAGS='-mmacosx-version-min=11.0'
            export CGO_LDFLAGS='-mmacosx-version-min=11.0'
          fi
          go test -race ./... > "$RUNNER_TEMP/tests.log" 2>&1 || { tail -c 4000 "$RUNNER_TEMP/tests.log"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}
          path: |
            installation_package/NET-Test-*
            installation_package/LICENSE
            installation_package/THIRD_PARTY_NOTICES.txt
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: installation_package
          merge-multiple: true
      - name: Publish release with checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd installation_package
          VERSION=${RELEASE_TAG#v}
          for asset in "NET-Test-$VERSION-macos-arm64.dmg" "NET-Test-$VERSION-windows-amd64-Setup.exe" "NET-Test-$VERSION-windows-amd64.exe" "NET-Test-$VERSION-linux-amd64.deb" LICENSE THIRD_PARTY_NOTICES.txt; do
            test -s "$asset"
          done
          test "$(find . -maxdepth 1 -name 'NET-Test-*' | wc -l)" -eq 4
          sha256sum NET-Test-* LICENSE THIRD_PARTY_NOTICES.txt > SHA256SUMS.txt
          cp ../docs/architecture/release-notes.txt "$RUNNER_TEMP/release-notes.txt"
          printf '\nBuild source: https://github.com/%s/commit/%s\nBuild verification: https://github.com/%s/actions/runs/%s\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$RUNNER_TEMP/release-notes.txt"
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "NET-Test $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.txt"
          fi
          gh release upload "$RELEASE_TAG" NET-Test-* LICENSE THIRD_PARTY_NOTICES.txt SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest --notes-file "$RUNNER_TEMP/release-notes.txt"
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/release-verification"
          cd "$RUNNER_TEMP/release-verification"
          sha256sum --check SHA256SUMS.txt
