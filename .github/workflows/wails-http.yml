name: Wails HTTP desktop
on:
  push:
    paths: ['wails-http/**', '.github/workflows/wails-http.yml']
  pull_request:
    paths: ['wails-http/**', '.github/workflows/wails-http.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: wails-http
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: wails-http/go.mod
          cache-dependency-path: wails-http/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: wails-http/frontend/package-lock.json
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update > "$RUNNER_TEMP/apt.log" 2>&1 || { tail -c 4000 "$RUNNER_TEMP/apt.log"; exit 1; }
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev > "$RUNNER_TEMP/apt.log" 2>&1 || { tail -c 4000 "$RUNNER_TEMP/apt.log"; exit 1; }
      - name: Install frontend dependencies
        run: npm --prefix frontend ci > "$RUNNER_TEMP/npm.log" 2>&1 || { tail -c 4000 "$RUNNER_TEMP/npm.log"; exit 1; }
      - name: Test HTTP lifecycle and saved results
        run: go test -race ./internal/ping > "$RUNNER_TEMP/tests.log" 2>&1 || { tail -c 4000 "$RUNNER_TEMP/tests.log"; exit 1; }
      - name: Build frontend
        run: npm --prefix frontend run build > "$RUNNER_TEMP/frontend.log" 2>&1 || { tail -c 4000 "$RUNNER_TEMP/frontend.log"; exit 1; }
      - name: Build native desktop executable
        run: |
          if [ "$RUNNER_OS" = 'macOS' ]; then
            export CGO_CFLAGS='-mmacosx-version-min=11.0'
            export CGO_LDFLAGS='-mmacosx-version-min=11.0'
          fi
          if [ "$RUNNER_OS" = 'Windows' ]; then
            go build -tags production -ldflags '-H windowsgui' -o bin/nt-http.exe . > "$RUNNER_TEMP/build.log" 2>&1 || { tail -c 4000 "$RUNNER_TEMP/build.log"; exit 1; }
          else
            go build -tags production -o bin/nt-http . > "$RUNNER_TEMP/build.log" 2>&1 || { tail -c 4000 "$RUNNER_TEMP/build.log"; exit 1; }
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: nt-http-${{ matrix.os }}
          path: wails-http/bin/nt-http*
